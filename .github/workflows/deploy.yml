name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  administration: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Force Pages source to GitHub Actions
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.request("PUT /repos/{owner}/{repo}/pages", {
                owner: context.repo.owner,
                repo: context.repo.repo,
                build_type: "workflow",
              });
              core.notice("GitHub Pages source set to GitHub Actions.");
            } catch (error) {
              if (error.status === 404) {
                await github.request("POST /repos/{owner}/{repo}/pages", {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  build_type: "workflow",
                  source: { branch: "main", path: "/" },
                });
                core.notice("GitHub Pages enabled with GitHub Actions as source.");
              } else {
                core.warning(`Could not change Pages source: ${error.message}`);
              }
            }

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
